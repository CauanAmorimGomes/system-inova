    <div class="online-dot"></div>
  </div>
</aside>
<main class="main-content">
  <header class="topbar">
    <button class="hamburger" onclick="toggleSidebar()"><i class="fa fa-bars"></i></button>
    <div class="topbar-title"><h1>Base de <span class="accent">Conhecimento</span></h1></div>
    <div class="topbar-actions"><div class="user-avatar sm">CG</div></div>
  </header>

  <div class="kb-hero">
    <div class="kb-search-big">
      <i class="fa fa-search"></i>
      <input type="text" id="kb-search" placeholder="Buscar artigos, procedimentos, soluções..." oninput="searchKB()" />
    </div>
    <div class="kb-stats">
      <span><i class="fa fa-file-lines accent"></i> 48 Artigos</span>
      <span><i class="fa fa-tag accent"></i> 6 Categorias</span>
      <span><i class="fa fa-eye accent"></i> 1.2k Visualizações</span>
    </div>
  </div>

  <div class="kb-categories">
    <button class="kb-cat-btn active" onclick="filterKB('',this)">Todos</button>
    <button class="kb-cat-btn" onclick="filterKB('Impressora',this)">🖨️ Impressoras</button>
    <button class="kb-cat-btn" onclick="filterKB('Suprimentos',this)">🖋️ Suprimentos</button>
    <button class="kb-cat-btn" onclick="filterKB('TI',this)">💻 TI</button>
    <button class="kb-cat-btn" onclick="filterKB('Rede',this)">🌐 Rede</button>
    <button class="kb-cat-btn" onclick="filterKB('Outro',this)">📋 Geral</button>
  </div>

  <div class="kb-articles" id="kb-articles"></div>

  <!-- Article Modal -->
  <div class="modal-overlay hidden" id="kb-modal">
    <div class="modal-box large">
      <div class="modal-header">
        <h2 id="kb-modal-title"></h2>
        <button class="modal-close" onclick="closeModal('kb-modal')"><i class="fa fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="kb-modal-body"></div>
    </div>
  </div>
<div class="toast hidden" id="toast"></div>
</main>
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="api.js"></script>
<script>
  const KB_ARTICLES = [
    { id:1, title:"Como limpar papel atolado na MX611", cat:"Impressora", views:234, tags:["atolamento","MX611"], body:"<p>1. Desligue a impressora e aguarde 5 minutos.</p><p>2. Abra a tampa traseira e remova o papel com cuidado.</p><p>3. Verifique se não há fragmentos de papel.</p><p>4. Reative e teste uma impressão.</p><p><strong>Dica:</strong> Use papel recomendado (75g/m²) para evitar atolamentos.</p>" },
    { id:2, title:"Troca de toner — Lexmark MX611", cat:"Impressora", views:189, tags:["toner","substituição","MX611"], body:"<p>1. Acesse o menu <strong>Configurações &gt; Manutenção</strong>.</p><p>2. Aguarde a mensagem de liberação do toner.</p><p>3. Abra a tampa frontal, gire e puxe o cartucho antigo.</p><p>4. Agite o novo cartucho 5x antes de inserir.</p><p>5. Encaixe e feche a tampa.</p>" },
    { id:3, title:"Impressora offline — diagnóstico rápido", cat:"Impressora", views:312, tags:["offline","rede","diagnóstico"], body:"<p>1. Verifique o cabo USB ou conexão Wi-Fi.</p><p>2. Reinicie o spooler: <code>services.msc &gt; Print Spooler &gt; Reiniciar</code>.</p><p>3. Desinstale e reinstale o driver.</p><p>4. Verifique firewall bloqueando porta 9100.</p>" },
    { id:4, title:"Configurar impressora em rede Windows 10/11", cat:"Rede", views:156, tags:["rede","driver","windows"], body:"<p>1. Acesse <strong>Painel de Controle &gt; Dispositivos e Impressoras</strong>.</p><p>2. Clique em 'Adicionar impressora'.</p><p>3. Selecione 'Adicionar impressora de rede'.</p><p>4. Insira o IP da impressora (ex: 192.168.1.50).</p>" },
    { id:5, title:"Epson L1250 — recarregar tinta EcoTank", cat:"Suprimentos", views:98, tags:["tinta","epson","ecotank"], body:"<p>1. Nunca deixe o nível abaixo do mínimo.</p><p>2. Use apenas tinta Epson original.</p><p>3. Abra o tampo do reservatório e alinhe o bico.</p><p>4. Preencha devagar sem ultrapassar a linha MAX.</p>" },
    { id:6, title:"Reset de contador de páginas Lexmark", cat:"Impressora", views:77, tags:["reset","manutenção"], body:"<p>1. Acesse o menu de administração (PIN: 1234).</p><p>2. Vá em Configurações &gt; Geral &gt; Contadores.</p><p>3. Selecione o contador desejado e pressione Reset.</p>" },
    { id:7, title:"VPN corporativa — configuração", cat:"TI", views:203, tags:["vpn","rede","segurança"], body:"<p>1. Baixe o cliente OpenVPN no portal TI.</p><p>2. Importe o arquivo .ovpn fornecido pelo admin.</p><p>3. Use as credenciais corporativas para conectar.</p>" },
    { id:8, title:"Solicitação de suprimentos — procedimento", cat:"Suprimentos", views:145, tags:["suprimentos","toner","pedido"], body:"<p>1. Abra um chamado com categoria 'Suprimentos'.</p><p>2. Informe o modelo da impressora e serial.</p><p>3. SLA: entrega em até 2 dias úteis.</p>" },
  ];
  let kbFilter = '', kbSearch = '';
  function searchKB() { kbSearch = document.getElementById('kb-search').value.toLowerCase(); renderKB(); }
  function filterKB(cat, btn) {
    document.querySelectorAll('.kb-cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    kbFilter = cat; renderKB();
  }
  function renderKB() {
    const arts = KB_ARTICLES.filter(a =>
      (!kbFilter || a.cat === kbFilter) &&
      (!kbSearch || a.title.toLowerCase().includes(kbSearch) || a.tags.some(t => t.includes(kbSearch)))
    );
    const el = document.getElementById('kb-articles');
    el.innerHTML = arts.length ? arts.map(a => `
      <div class="kb-card" onclick="openArticle(${a.id})">
        <div class="kb-card-cat">${a.cat}</div>
        <h3>${a.title}</h3>
        <div class="kb-card-meta"><i class="fa fa-eye"></i> ${a.views} <span>${a.tags.map(t=>'<span class=kb-tag>'+t+'</span>').join('')}</span></div>
      </div>`).join('') : '<div class="empty-state" style="text-align:center;padding:3rem;color:#64748b"><i class="fa fa-search" style="font-size:2rem;margin-bottom:1rem;display:block"></i>Nenhum artigo encontrado</div>';
  }
  function openArticle(id) {
    const a = KB_ARTICLES.find(x => x.id === id);
    document.getElementById('kb-modal-title').textContent = a.title;
    document.getElementById('kb-modal-body').innerHTML = `<div class="kb-full-article">${a.body}</div>`;
    document.getElementById('kb-modal').classList.remove('hidden');
  }
  window.onload = () => { checkAuth(); renderKB(); };
</script>
<!-- Sidebar overlay for mobile -->
<div id="sidebar-overlay" class="sidebar-overlay hidden" onclick="toggleSidebar()"></div>
<script src="notifications.js"></script>
</body>
</html>
